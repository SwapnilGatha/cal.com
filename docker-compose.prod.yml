# Cal.com Production Docker Compose
# Use this with: docker compose -f docker-compose.prod.yml up -d

volumes:
  database-data:
  redis-data:

networks:
  stack:
    name: stack
    external: false

services:
  database:
    container_name: database
    image: postgres:15-alpine
    restart: always
    volumes:
      - database-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stack

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stack

  calcom:
    container_name: calcom
    image: krishnavamshi933/calcom-web:latest
    restart: always
    networks:
      - stack
    ports:
      - 3000:3000
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - DATABASE_DIRECT_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - WEBAPP_URL=${WEBAPP_URL}
      - NEXT_PUBLIC_WEBAPP_URL=${NEXT_PUBLIC_WEBAPP_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
    depends_on:
      database:
        condition: service_healthy

  calcom-api:
    container_name: calcom-api
    image: krishnavamshi933/calcom-api:latest
    restart: always
    networks:
      - stack
    ports:
      - "8080:80"
    env_file: .env
    environment:
      - NODE_ENV=production
      - API_PORT=80
      - API_URL=${API_URL}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - DATABASE_READ_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - DATABASE_WRITE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - DATABASE_DIRECT_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - WEBAPP_URL=${WEBAPP_URL}
      - NEXT_PUBLIC_WEBAPP_URL=${NEXT_PUBLIC_WEBAPP_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  calcom-sync-api:
    container_name: calcom-sync-api
    image: krishnavamshi933/calcom-sync:latest
    restart: always
    networks:
      - stack
    ports:
      - 3002:3002
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - DATABASE_DIRECT_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - SYNC_API_SECRET=${SYNC_API_SECRET}
      - SHADOW_USER_PASSWORD=${SHADOW_USER_PASSWORD}
      - DEFAULT_TIMEZONE=${DEFAULT_TIMEZONE:-UTC}
      - DEFAULT_EVENT_TYPE_SLUG=${DEFAULT_EVENT_TYPE_SLUG:-30min}
      - DEFAULT_EVENT_TYPE_TITLE=${DEFAULT_EVENT_TYPE_TITLE:-30 Min Meeting}
      - DEFAULT_WORKING_HOURS_START=${DEFAULT_WORKING_HOURS_START:-9}
      - DEFAULT_WORKING_HOURS_END=${DEFAULT_WORKING_HOURS_END:-17}
    depends_on:
      database:
        condition: service_healthy

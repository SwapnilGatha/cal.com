# Cal.com Production Docker Compose
# Use this with: docker compose -f docker-compose.prod.yml up -d

volumes:
  database-data:
  redis-data:

networks:
  stack:
    name: stack
    external: false

services:
  database:
    container_name: database
    image: postgres
    restart: always
    volumes:
      - database-data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - stack
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    container_name: redis
    image: redis:latest
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - stack
    deploy:
      resources:
        limits:
          memory: 512M

  calcom:
    image: calcom.docker.scarf.sh/calcom/cal.com:v6.0.7
    # Note: Use v6.0.7-arm for ARM-based production hosts
    restart: always
    networks:
      - stack
    ports:
      - 3000:3000
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database/${POSTGRES_DB}
      - DATABASE_DIRECT_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database/${POSTGRES_DB}
    depends_on:
      - database
    deploy:
      resources:
        limits:
          memory: 2G

  calcom-api:
    container_name: calcom-api
    image: calcom.docker.scarf.sh/calcom/api:v6.0.7
    restart: always
    networks:
      - stack
    ports:
      - "${API_PORT:-80}:${API_PORT:-80}"
    env_file: .env
    environment:
      - NODE_ENV=production
      - API_PORT=${API_PORT:-80}
      - API_URL=${API_URL}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database/${POSTGRES_DB}
      - DATABASE_READ_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database/${POSTGRES_DB}
      - DATABASE_WRITE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database/${POSTGRES_DB}
      - DATABASE_DIRECT_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database/${POSTGRES_DB}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
    depends_on:
      - database
      - redis
    deploy:
      resources:
        limits:
          memory: 1G
